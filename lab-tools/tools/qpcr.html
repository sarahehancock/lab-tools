<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qPCR ΔΔCt Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--border:#30363d;
  --accent:#58a6ff;--green:#3fb950;--orange:#f0883e;--red:#f85149;--yellow:#e3b341;
  --muted:#8b949e;--text:#e6edf3;--text2:#c9d1d9;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:13px}
.badge{background:rgba(227,179,65,.12);color:var(--yellow);border:1px solid rgba(227,179,65,.3);padding:2px 8px;border-radius:12px;font-size:10px;font-family:var(--mono)}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:270px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.main{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card-head{background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 12px;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-body{padding:14px}
label{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px;padding:5px 8px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
.f{margin-bottom:10px}.f:last-child{margin-bottom:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;border:none;font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-p{background:var(--accent);color:#0d1117}.btn-p:hover{background:#79c0ff}
.btn-s{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.sep{height:1px;background:var(--border);margin:8px 0}
.flex{display:flex;gap:8px;align-items:center}
.grow{flex:1}

/* Ct input table */
.cttbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
.cttbl th{background:var(--surface2);color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
.cttbl td{padding:3px 4px;border-bottom:1px solid rgba(48,54,61,.35);vertical-align:middle}
.cttbl tr:last-child td{border-bottom:none}
.cttbl input{padding:3px 5px;font-size:11px;width:68px;text-align:center}
.cttbl .th-gene{color:var(--accent)}
.cttbl .th-ref{color:var(--green)}

/* Results table */
table.res{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
table.res th{background:var(--surface2);color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
table.res td{padding:6px 10px;border-bottom:1px solid rgba(48,54,61,.4);color:var(--text2)}
table.res tr:last-child td{border-bottom:none}
table.res tr:hover td{background:rgba(255,255,255,.02)}

/* Bar chart canvas */
#bar-canvas{display:block;width:100%}

.notice{padding:8px 12px;border-radius:6px;font-size:11px;margin-bottom:8px}
.ni{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.2);color:var(--accent)}
.nw{background:rgba(240,136,62,.1);border:1px solid rgba(240,136,62,.25);color:var(--orange)}
.ns{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);color:var(--green)}

.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-family:var(--mono)}
.tag-up{background:rgba(63,185,80,.12);color:var(--green)}
.tag-dn{background:rgba(248,81,73,.1);color:var(--red)}
.tag-nc{background:rgba(139,148,158,.1);color:var(--muted)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<header>
  <div class="logo">⬡ LAB·TOOLS</div>
  <div class="badge">qPCR ΔΔCt</div>
  <div style="flex:1"></div>
  <button class="btn btn-s" onclick="exportCSV()">⬇ Export CSV</button>
</header>
<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="card">
    <div class="card-head">⚙ Experiment Setup</div>
    <div class="card-body">
      <div class="f">
        <label>Reference Genes (one per line)</label>
        <textarea id="ref-genes" rows="3" placeholder="GAPDH&#10;ACTB&#10;HPRT1" oninput="buildTable()">GAPDH
ACTB</textarea>
      </div>
      <div class="f">
        <label>Target Genes (one per line)</label>
        <textarea id="tgt-genes" rows="4" placeholder="Gene1&#10;Gene2&#10;Gene3" oninput="buildTable()">MYC
CDKN1A
BCL2</textarea>
      </div>
      <div class="f">
        <label>Experimental Groups (one per line)</label>
        <textarea id="groups" rows="4" placeholder="Control&#10;Treatment A&#10;Treatment B" oninput="buildTable()">Control
Treatment</textarea>
      </div>
      <div class="f">
        <label>Reference Group (for ΔΔCt)</label>
        <select id="ref-group" onchange="runAnalysis()"></select>
      </div>
      <div class="f">
        <label>Replicates per group</label>
        <input type="number" id="n-reps" value="3" min="1" max="8" oninput="buildTable()">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">📥 Paste Ct Data</div>
    <div class="card-body">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.6">
        Paste tab-delimited Ct values from your qPCR software. Expected columns: <span style="color:var(--accent)">Gene, Group, Rep1, Rep2…</span>
      </div>
      <textarea id="ct-paste" rows="5" placeholder="Gene&#9;Group&#9;Rep1&#9;Rep2&#9;Rep3&#10;GAPDH&#9;Control&#9;18.2&#9;18.4&#9;18.1" style="font-size:11px"></textarea>
      <button class="btn btn-p" style="width:100%;margin-top:6px" onclick="importCt()">↳ Import</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">⚙ Analysis Options</div>
    <div class="card-body">
      <div class="f">
        <label>PCR Efficiency</label>
        <select id="efficiency" onchange="runAnalysis()">
          <option value="2">Standard (E=2, 100%)</option>
          <option value="custom">Custom efficiency</option>
        </select>
      </div>
      <div class="f" id="eff-custom-row" style="display:none">
        <label>Efficiency value (1.8–2.1)</label>
        <input type="number" id="eff-val" value="1.95" min="1.5" max="2.2" step="0.01" oninput="runAnalysis()">
      </div>
      <div class="f">
        <label>Show fold change as</label>
        <select id="fc-display" onchange="runAnalysis()">
          <option value="fc">Fold change (2^−ΔΔCt)</option>
          <option value="log2">Log₂ fold change (−ΔΔCt)</option>
        </select>
      </div>
      <button class="btn btn-p" style="width:100%;margin-top:4px" onclick="runAnalysis()">▶ Calculate</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- Ct input table -->
  <div class="card">
    <div class="card-head">📋 Ct Values Input
      <span style="flex:1"></span>
      <span style="font-size:10px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">Green = reference genes · Blue = target genes</span>
    </div>
    <div class="card-body" style="padding:0;overflow-x:auto">
      <div id="ct-table-wrap" style="padding:12px"></div>
    </div>
  </div>

  <!-- Results -->
  <div class="card">
    <div class="card-head">📊 Results — Fold Change (2^−ΔΔCt)</div>
    <div class="card-body">
      <div id="analysis-notice"></div>
      <div style="overflow-x:auto">
        <table class="res" id="res-table">
          <thead><tr id="res-head"></tr></thead>
          <tbody id="res-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bar chart -->
  <div class="card">
    <div class="card-head">📈 Bar Chart</div>
    <div class="card-body">
      <canvas id="bar-canvas" height="280"></canvas>
    </div>
  </div>

</div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
// ctData[gene][group][rep] = Ct value string
let ctData = {};
let lastResults = [];

function getList(id){ return document.getElementById(id).value.trim().split('\n').map(s=>s.trim()).filter(s=>s); }
function refGenes(){ return getList('ref-genes'); }
function tgtGenes(){ return getList('tgt-genes'); }
function groups(){ return getList('groups'); }
function nReps(){ return parseInt(document.getElementById('n-reps').value)||3; }

// ── Build Ct table ─────────────────────────────────────────────────────────────
function buildTable(){
  const refs=refGenes(), tgts=tgtGenes(), grps=groups(), reps=nReps();
  const allGenes=[...refs,...tgts];

  // Update reference group selector
  const refSel=document.getElementById('ref-group');
  const curRef=refSel.value;
  refSel.innerHTML=grps.map(g=>`<option value="${g}"${g===curRef?'selected':''}>${g}</option>`).join('');

  // Build table
  const wrap=document.getElementById('ct-table-wrap');
  let html=`<table class="cttbl"><thead><tr><th>Gene</th><th>Group</th>`;
  for(let i=1;i<=reps;i++) html+=`<th>Rep ${i}</th>`;
  html+=`</tr></thead><tbody>`;

  allGenes.forEach(gene=>{
    const isRef=refs.includes(gene);
    grps.forEach((grp,gi)=>{
      html+=`<tr>`;
      if(gi===0) html+=`<td rowspan="${grps.length}" style="font-weight:600;color:${isRef?'var(--green)':'var(--accent)'};vertical-align:middle;padding:4px 8px">${gene}</td>`;
      html+=`<td style="color:var(--muted);white-space:nowrap;padding:4px 8px">${grp}</td>`;
      for(let r=0;r<reps;r++){
        const val=(ctData[gene]&&ctData[gene][grp]&&ctData[gene][grp][r]!==undefined)?ctData[gene][grp][r]:'';
        html+=`<td><input type="number" value="${val}" placeholder="Ct" step="0.01" min="1" max="45" data-gene="${gene}" data-grp="${grp}" data-rep="${r}" onchange="setCt(this)"></td>`;
      }
      html+=`</tr>`;
    });
  });
  html+=`</tbody></table>`;
  wrap.innerHTML=html;

  // Efficiency custom row
  document.getElementById('eff-custom-row').style.display=
    document.getElementById('efficiency').value==='custom'?'block':'none';

  runAnalysis();
}

function setCt(el){
  const gene=el.dataset.gene, grp=el.dataset.grp, rep=parseInt(el.dataset.rep);
  if(!ctData[gene]) ctData[gene]={};
  if(!ctData[gene][grp]) ctData[gene][grp]=[];
  ctData[gene][grp][rep]=el.value===''?undefined:parseFloat(el.value);
  runAnalysis();
}

// ── Import pasted Ct ───────────────────────────────────────────────────────────
function importCt(){
  const raw=document.getElementById('ct-paste').value.trim();
  if(!raw) return;
  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l);
  const header=lines[0].split('\t').map(s=>s.trim());
  lines.slice(1).forEach(line=>{
    const parts=line.split('\t').map(s=>s.trim());
    const gene=parts[0], grp=parts[1];
    if(!gene||!grp) return;
    if(!ctData[gene]) ctData[gene]={};
    if(!ctData[gene][grp]) ctData[gene][grp]=[];
    for(let i=2;i<parts.length;i++){
      const v=parseFloat(parts[i]);
      if(!isNaN(v)) ctData[gene][grp][i-2]=v;
    }
  });
  document.getElementById('ct-paste').value='';
  buildTable();
}

// ── Geometry mean ──────────────────────────────────────────────────────────────
function geoMean(vals){ return Math.pow(vals.reduce((p,v)=>p*v,1),1/vals.length); }
function mean(vals){ return vals.reduce((a,b)=>a+b,0)/vals.length; }
function sd(vals){ const m=mean(vals); return Math.sqrt(vals.reduce((s,v)=>s+(v-m)**2,0)/(vals.length-1||1)); }

// ── Run analysis ───────────────────────────────────────────────────────────────
function runAnalysis(){
  document.getElementById('eff-custom-row').style.display=
    document.getElementById('efficiency').value==='custom'?'block':'none';

  const refs=refGenes(), tgts=tgtGenes(), grps=groups(), reps=nReps();
  const refGrp=document.getElementById('ref-group').value||grps[0];
  const effMode=document.getElementById('efficiency').value;
  const E=effMode==='custom'?parseFloat(document.getElementById('eff-val').value)||2:2;
  const fcDisplay=document.getElementById('fc-display').value;
  const notEl=document.getElementById('analysis-notice');

  if(!refs.length||!tgts.length||!grps.length){ notEl.innerHTML='<div class="notice ni">Set up genes and groups, then enter Ct values.</div>'; return; }

  // For each group × gene: get valid Ct reps
  const getCts=(gene,grp)=>{
    if(!ctData[gene]||!ctData[gene][grp]) return [];
    return ctData[gene][grp].filter(v=>v!==undefined&&!isNaN(v)&&v>0&&v<45);
  };

  // ΔCt = target_Ct − geomean(ref_Cts) per replicate if possible, else per group mean
  // Strategy: compute mean Ct per gene per group, then ΔCt = mean(target) − geomean(mean(refs))
  const results=[];
  let notices=[];

  tgts.forEach(gene=>{
    const row={gene, groups:{}};
    let refGroupDeltaCt=null;

    grps.forEach(grp=>{
      const tCts=getCts(gene,grp);
      if(!tCts.length){ row.groups[grp]={error:'no data'}; return; }

      // Reference geomean per replicate where possible
      const refMeans=refs.map(r=>{
        const rCts=getCts(r,grp);
        return rCts.length?mean(rCts):null;
      }).filter(v=>v!==null);

      if(!refMeans.length){ row.groups[grp]={error:'no ref data'}; return; }
      const refNorm=refMeans.length===1?refMeans[0]:geoMean(refMeans);
      const deltaCt=mean(tCts)-refNorm;
      const sdTgt=sd(tCts);

      if(grp===refGrp) refGroupDeltaCt=deltaCt;
      row.groups[grp]={deltaCt,sdTgt,tCts,refNorm};
    });

    // ΔΔCt
    grps.forEach(grp=>{
      const g=row.groups[grp];
      if(!g||g.error||refGroupDeltaCt===null) return;
      const ddCt=g.deltaCt-refGroupDeltaCt;
      const fc=Math.pow(E,-ddCt);
      const fcProp=g.sdTgt*Math.log(E)*fc; // error propagation
      g.ddCt=ddCt; g.fc=fc; g.fcProp=fcProp;
    });
    results.push(row);
  });

  lastResults=results;

  // Build results table
  const thead=document.getElementById('res-head');
  const tbody=document.getElementById('res-body');
  const fcLabel=fcDisplay==='log2'?'Log₂ FC':'Fold Change';
  thead.innerHTML=`<th>Gene</th>`+grps.filter(g=>g!==refGrp).map(g=>`<th>${g} ${fcLabel}</th><th>±SD</th><th></th>`).join('');
  tbody.innerHTML='';

  results.forEach(row=>{
    const tr=document.createElement('tr');
    let cells=`<td style="font-weight:600;color:var(--accent)">${row.gene}</td>`;
    grps.filter(g=>g!==refGrp).forEach(grp=>{
      const g=row.groups[grp];
      if(!g||g.error||g.fc===undefined){
        cells+=`<td colspan="3" style="color:var(--muted)">—</td>`;
        return;
      }
      const val=fcDisplay==='log2'?(-g.ddCt).toFixed(3):g.fc.toFixed(3);
      const err=fcDisplay==='log2'?(g.sdTgt).toFixed(3):(g.fcProp).toFixed(3);
      const up=g.fc>1.5, dn=g.fc<0.67;
      const tag=up?'<span class="tag tag-up">↑ Up</span>':dn?'<span class="tag tag-dn">↓ Down</span>':'<span class="tag tag-nc">→ NC</span>';
      cells+=`<td style="font-weight:600;color:${up?'var(--green)':dn?'var(--red)':'var(--text)'}">${val}</td><td style="color:var(--muted)">±${err}</td><td>${tag}</td>`;
    });
    tr.innerHTML=cells;
    tbody.appendChild(tr);
  });

  if(results.every(r=>Object.values(r.groups).every(g=>!g||g.error)))
    notEl.innerHTML='<div class="notice ni">Enter Ct values above to see results.</div>';
  else notEl.innerHTML='';

  drawBarChart(results,grps,refGrp,fcDisplay);
}

// ── Bar chart ──────────────────────────────────────────────────────────────────
const COLORS=['#58a6ff','#3fb950','#f0883e','#a371f7','#ffa657','#79c0ff'];
function drawBarChart(results,grps,refGrp,fcDisplay){
  const cv=document.getElementById('bar-canvas');
  const dpr=window.devicePixelRatio||1;
  const W=cv.parentElement.clientWidth-24, H=280;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const pad={l:56,r:120,t:20,b:60};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  ctx.fillStyle='#161b22'; ctx.fillRect(0,0,W,H);

  const compGrps=grps.filter(g=>g!==refGrp);
  if(!compGrps.length||!results.length) return;

  const genes=results.map(r=>r.gene);
  const nGenes=genes.length, nGrps=compGrps.length;
  const groupW=pw/nGenes, barW=Math.min((groupW/(nGrps+1))*0.9,28);

  // Collect all fc values for scale
  const allFc=[];
  results.forEach(row=>compGrps.forEach(grp=>{ if(row.groups[grp]&&row.groups[grp].fc!==undefined) allFc.push(row.groups[grp].fc); }));
  if(!allFc.length) return;
  const fcMax=Math.max(2,...allFc)*1.15;
  const fcMin=Math.min(0,...allFc)*1.1;

  const ty=v=>pad.t+ph-(v-fcMin)/(fcMax-fcMin)*ph;
  const y0=ty(fcDisplay==='log2'?0:1);

  // Grid
  ctx.strokeStyle='rgba(48,54,61,.5)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.t+i*(ph/4);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+pw,y); ctx.stroke();
    const val=fcMax-i*(fcMax-fcMin)/4;
    ctx.fillStyle='#8b949e'; ctx.font='9px IBM Plex Mono'; ctx.textAlign='right';
    ctx.fillText(val.toFixed(fcDisplay==='log2'?1:2),pad.l-4,y+4);
  }
  // Baseline
  ctx.strokeStyle='rgba(139,148,158,.4)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(pad.l,y0); ctx.lineTo(pad.l+pw,y0); ctx.stroke();

  // Bars
  results.forEach((row,gi)=>{
    const xBase=pad.l+gi*groupW+groupW/2-(nGrps*barW+(nGrps-1)*2)/2;
    compGrps.forEach((grp,ci)=>{
      const g=row.groups[grp];
      if(!g||g.fc===undefined) return;
      const val=fcDisplay==='log2'?-g.ddCt:g.fc;
      const col=COLORS[ci%COLORS.length];
      const x=xBase+ci*(barW+2);
      const yTop=ty(Math.max(val,fcDisplay==='log2'?0:1));
      const yBot=ty(Math.min(val,fcDisplay==='log2'?0:1));
      ctx.fillStyle=col+'99';
      ctx.fillRect(x,Math.min(yTop,y0),barW,Math.abs(yBot-yTop)||1);
      ctx.strokeStyle=col; ctx.lineWidth=1.5;
      ctx.strokeRect(x,Math.min(yTop,y0),barW,Math.abs(yBot-yTop)||1);
      // Error bar
      const err=fcDisplay==='log2'?g.sdTgt:g.fcProp;
      if(err>0){
        const yE=ty(val+err), yEb=ty(val-err);
        ctx.strokeStyle=col; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(x+barW/2,yE); ctx.lineTo(x+barW/2,yEb); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+barW/2-3,yE); ctx.lineTo(x+barW/2+3,yE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+barW/2-3,yEb); ctx.lineTo(x+barW/2+3,yEb); ctx.stroke();
      }
    });
    // Gene label
    ctx.fillStyle='#c9d1d9'; ctx.font='10px IBM Plex Sans'; ctx.textAlign='center';
    ctx.fillText(row.gene,pad.l+gi*groupW+groupW/2,H-pad.b+14);
  });

  // Legend
  compGrps.forEach((grp,ci)=>{
    const lx=pad.l+pw+10, ly=pad.t+ci*20;
    ctx.fillStyle=COLORS[ci%COLORS.length]+'99'; ctx.fillRect(lx,ly,10,10);
    ctx.strokeStyle=COLORS[ci%COLORS.length]; ctx.lineWidth=1; ctx.strokeRect(lx,ly,10,10);
    ctx.fillStyle='#8b949e'; ctx.font='10px IBM Plex Sans'; ctx.textAlign='left';
    ctx.fillText(grp.slice(0,14),lx+14,ly+9);
  });
  // Y-axis label
  ctx.fillStyle='#8b949e'; ctx.font='10px IBM Plex Sans'; ctx.textAlign='center';
  ctx.save(); ctx.translate(12,pad.t+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText(fcDisplay==='log2'?'Log₂ Fold Change':'Fold Change (2^−ΔΔCt)',0,0); ctx.restore();
}

// ── Export ─────────────────────────────────────────────────────────────────────
function exportCSV(){
  const grps=groups(), refGrp=document.getElementById('ref-group').value||grps[0];
  const compGrps=grps.filter(g=>g!==refGrp);
  const rows=[['Gene',...compGrps.flatMap(g=>[g+'_FC',g+'_ddCt',g+'_SD'])]];
  lastResults.forEach(row=>{
    rows.push([row.gene,...compGrps.flatMap(g=>{
      const d=row.groups[g];
      if(!d||d.fc===undefined) return ['—','—','—'];
      return [d.fc.toFixed(4),(-d.ddCt).toFixed(4),d.sdTgt.toFixed(4)];
    })]);
  });
  if(rows.length<2){ alert('Run analysis first.'); return; }
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='qpcr_results.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); document.body.removeChild(a); },100);
}

// ── Init ───────────────────────────────────────────────────────────────────────
document.getElementById('efficiency').addEventListener('change',()=>{
  document.getElementById('eff-custom-row').style.display=
    document.getElementById('efficiency').value==='custom'?'block':'none';
  runAnalysis();
});
buildTable();
</script>
